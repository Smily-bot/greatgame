<!DOCTYPE html>
<html lang="en">
<head>
<style>

.dropdown {
  float: right;
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f1f1f1;
  min-width: 160px;
  overflow: auto;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  right: 0;
  z-index: 1;
}

.dropdown a:hover {background-color: #ddd;}

.show {display: block;}
</style>

<script>
/* When the user clicks on the button, 
toggle between hiding and showing the dropdown content */
function myFunction() {
  document.getElementById("myDropdown").classList.toggle("show");
}

function myFunction1() {
  document.getElementById("myDropdown1").classList.toggle("show");
}

// Close the dropdown if the user clicks outside of it
window.onclick = function(event) {
  if (!event.target.matches('.dropbtn')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    var i;
    for (i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) {
        openDropdown.classList.remove('show');
      }
    }
  }
}
</script>

<link rel="stylesheet" href="css/editor.css">
<nav class="navbar navbar-expand-sm bg-light">
<div class="container-fluid">

<span>LEVEL EDITOR</span>

<div class="dropdown">
  <button onclick="myFunction()" class="dropbtn">File</button>
  <div id="myDropdown" class="dropdown-content">

	<br/><br/><br/>
	<button onclick="document.getElementById('fileSelector').click()" type="button" class="button">Load</button>
  </div>
</div>

<div class="dropdown">
  <button onclick="myFunction1()" class="dropbtn">Edit</button>
  <div id="myDropdown1" class="dropdown-content">
    <button type="button" class="button" onclick="reset();">reset</button>
	<br/><br/><br/>
	<button type="button" class="button" onclick="undw();">undo wall</button>
  </div>
</div>
